services:
  # 前端 React
  - type: web
    runtime: static
    name: livechat-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 後端 Node.js
  - type: web
    runtime: node
    name: livechat-server
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
